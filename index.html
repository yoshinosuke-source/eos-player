<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EOS Player & Sync Studio</title>
  <style>
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --card-active: #2c2c2e;
      --accent: #0a84ff;
      --text: #ffffff;
      --sub: #8e8e93;
      --success: #30d158;
      --warning: #ff9f0a;
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; max-width: 540px; margin: 0 auto; min-height: 100vh; padding-bottom: 90px; }
    
    /* Header & Navigation Tabs */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
    .tab-switch { display: flex; background: #2c2c2e; border-radius: 8px; padding: 2px; }
    .tab-btn { background: none; border: none; color: var(--sub); padding: 6px 12px; font-size: 12px; font-weight: 600; border-radius: 6px; cursor: pointer; }
    .tab-btn.active { background: #3a3a3c; color: var(--text); }

    /* Audio Import Box */
    .file-box { background: var(--card); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
    .file-label { background: var(--accent); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .file-box input { display: none; }
    .file-info { font-size: 12px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }

    /* Player Console */
    .player-deck { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; text-align: center; }
    .track-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .time-info { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; margin-bottom: 10px; }
    .seek-bar-wrap { width: 100%; height: 5px; background: #2c2c2e; border-radius: 3px; cursor: pointer; margin-bottom: 14px; position: relative; }
    .seek-bar { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; }
    
    .ctrl-row { display: flex; align-items: center; justify-content: center; gap: 20px; }
    .btn { background: none; border: none; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .btn:active { opacity: 0.6; }
    .btn-play { width: 50px; height: 50px; border-radius: 50%; background: var(--text); color: var(--bg); font-size: 18px; font-weight: bold; }
    .toggle-pill { padding: 6px 12px; border-radius: 12px; background: #2c2c2e; font-size: 12px; color: var(--sub); }
    .toggle-pill.active { background: var(--warning); color: #000; font-weight: 600; }

    /* Display Mode Filter */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; justify-content: center; }
    .filter-btn { background: #1c1c1e; border: 1px solid #2c2c2e; color: var(--sub); padding: 4px 10px; border-radius: 10px; font-size: 11px; }
    .filter-btn.active { border-color: var(--accent); color: var(--accent); }

    /* Cards */
    .lyrics-list { display: flex; flex-direction: column; gap: 10px; }
    .lyric-card { background: var(--card); border-radius: 12px; padding: 12px 14px; border: 1px solid transparent; cursor: pointer; }
    .lyric-card.active { border-color: var(--accent); background: var(--card-active); }
    .lyric-card.looping { border-color: var(--warning); }
    
    .card-main { display: flex; justify-content: space-between; align-items: flex-start; }
    .en-text { font-size: 15px; font-weight: 600; line-height: 1.35; margin-bottom: 4px; }
    .ja-text { font-size: 13px; color: var(--sub); line-height: 1.3; }
    
    /* Explanations Accordion */
    .details-toggle { margin-top: 8px; font-size: 11px; color: var(--accent); cursor: pointer; display: inline-block; }
    .details-box { display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid #2c2c2e; font-size: 12px; color: #d1d1d6; line-height: 1.45; }
    .details-box.open { display: block; }
    .tag-sec { font-size: 11px; font-weight: 700; color: var(--warning); margin-bottom: 4px; text-transform: uppercase; }

    /* Sync Studio Panel */
    .studio-panel { display: none; background: var(--card); border-radius: var(--radius); padding: 16px; }
    .studio-panel.active { display: block; }
    .studio-input { width: 100%; height: 160px; background: #121214; border: 1px solid #2c2c2e; border-radius: 8px; color: #fff; padding: 10px; font-size: 13px; margin-bottom: 12px; resize: vertical; }
    .sync-btn { width: 100%; padding: 18px; border-radius: 14px; border: none; background: var(--accent); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 12px; }
    .sync-btn:active { background: #0071e3; }
    .sync-status { font-size: 13px; color: var(--sub); text-align: center; }

    /* Bottom Dock */
    .dock { position: fixed; bottom: 12px; left: 16px; right: 16px; max-width: 508px; margin: 0 auto; background: rgba(28,28,30,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: var(--radius); padding: 10px 14px; display: flex; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .dock-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
    .dock-review { background: #2c2c2e; color: var(--warning); }
    .dock-gotit { background: var(--success); color: #000; }
  </style>
</head>
<body>

  <header>
    <h1>EOS 1.0</h1>
    <div class="tab-switch">
      <button class="tab-btn active" id="tabPlayer" onclick="switchTab('player')">プレイヤー</button>
      <button class="tab-btn" id="tabStudio" onclick="switchTab('studio')">Sync Studio</button>
    </div>
  </header>

  <!-- Audio File Loader -->
  <div class="file-box">
    <label class="file-label" for="audioUpload">MP3音源を選択</label>
    <input type="file" id="audioUpload" accept="audio/*">
    <div class="file-info" id="audioStatus">未設定（端末から選んで保存）</div>
  </div>

  <!-- VIEW 1: PLAYER -->
  <div id="viewPlayer">
    <div class="player-deck">
      <div class="track-title" id="trackName">Track 01: Call Me Yosshii!</div>
      <div class="time-info" id="timeLabel">0:00 / 0:00</div>
      <div class="seek-bar-wrap" id="seekWrap"><div class="seek-bar" id="seekBar"></div></div>
      <div class="ctrl-row">
        <button class="btn toggle-pill" id="loopLockBtn" onclick="toggleLoopLock()">フレーズ固定: OFF</button>
        <button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶</button>
        <button class="btn toggle-pill" id="rateBtn" onclick="cycleRate()">1.0x</button>
      </div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="setDisplayMode('all')">英 ＋ 日</button>
      <button class="filter-btn" onclick="setDisplayMode('en')">英語のみ</button>
      <button class="filter-btn" onclick="setDisplayMode('ja')">日本語のみ</button>
    </div>

    <div class="lyrics-list" id="lyricsDeck"></div>
  </div>

  <!-- VIEW 2: SYNC STUDIO -->
  <div class="studio-panel" id="viewStudio">
    <p style="font-size:13px; color:var(--sub); margin-bottom:8px;">歌詞を貼り付け（改行で1行＝1フレーズ認識）</p>
    <textarea class="studio-input" id="studioInput" placeholder="[Verse 1]&#10;Alarm rings out at five AM&#10;Thirty-minute run, starting up again&#10;..."></textarea>
    <button class="sync-btn" id="syncTapBtn" onclick="handleSyncTap()">曲を流してタップ同期を開始</button>
    <div class="sync-status" id="syncStatus">曲に合わせてボタンをポンと押すと記録されます</div>
  </div>

  <!-- Dock Actions -->
  <div class="dock" id="bottomDock">
    <button class="dock-btn dock-review" onclick="markCard('review')">↻ もう一回 (Review)</button>
    <button class="dock-btn dock-gotit" onclick="markCard('master')">✓ 覚えた (Got it)</button>
  </div>

  <audio id="audio"></audio>

  <script>
    let trackItems = [
      { sec: "Verse 1", start: 0.0, end: 4.5, en: "Alarm rings out at five AM", ja: "午前5時にアラームが鳴り響く", note: "【at five AM】時刻を表す前置詞at。短縮のリズムを意識。", status: "review" },
      { sec: "Verse 1", start: 4.5, end: 8.8, en: "Thirty-minute run, starting up again", ja: "30分のランニング、再び一日が動き出す", note: "【Thirty-minute】ハイフン連結で形容詞化するため単数形。", status: "review" },
      { sec: "Verse 1", start: 8.8, end: 13.0, en: "Soy latte warm inside my hand", sub: "ソイラテを手にして", ja: "温かいソイラテを手にして", note: "【warm inside...】名詞の後ろに形容詞を置く後置修飾。", status: "review" },
      { sec: "Chorus", start: 13.0, end: 18.0, en: "Hey, call me Yosshii, hear the beat!", ja: "ビートを感じて、よっしーと呼んでくれ！", note: "【call me + 名前】第5文型(SVOC)の命令形。", status: "review" }
    ];

    const audio = document.getElementById('audio');
    let activeIdx = 0;
    let isLoopLocked = false;
    let displayMode = 'all';
    const rates = [0.8, 1.0, 1.2];
    let rateIdx = 1;

    // IndexedDB
    function openDB() {
      return new Promise(res => {
        const r = indexedDB.open("EOS_DB", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("store");
        r.onsuccess = () => res(r.result);
      });
    }
    async function persistAudio(blob) {
      const db = await openDB();
      db.transaction("store","readwrite").objectStore("store").put(blob, "user_track");
      document.getElementById('audioStatus').innerText = "端末内に保存完了";
    }
    async function restoreAudio() {
      const db = await openDB();
      const req = db.transaction("store","readonly").objectStore("store").get("user_track");
      req.onsuccess = () => {
        if (req.result) {
          audio.src = URL.createObjectURL(req.result);
          document.getElementById('audioStatus').innerText = "保存済み音源をロード";
        }
      };
    }

    document.getElementById('audioUpload').onchange = (e) => {
      const f = e.target.files[0];
      if (f) {
        audio.src = URL.createObjectURL(f);
        persistAudio(f);
        audio.play();
        document.getElementById('playBtn').innerText = "❚❚";
      }
    };

    function switchTab(t) {
      document.getElementById('tabPlayer').classList.toggle('active', t === 'player');
      document.getElementById('tabStudio').classList.toggle('active', t === 'studio');
      document.getElementById('viewPlayer').style.display = t === 'player' ? 'block' : 'none';
      document.getElementById('viewStudio').classList.toggle('active', t === 'studio');
      document.getElementById('bottomDock').style.display = t === 'player' ? 'flex' : 'none';
    }

    function renderCards() {
      const deck = document.getElementById('lyricsDeck');
      deck.innerHTML = '';
      trackItems.forEach((item, i) => {
        const c = document.createElement('div');
        c.className = `lyric-card ${i === activeIdx ? 'active' : ''} ${i === activeIdx && isLoopLocked ? 'looping' : ''}`;
        
        const showEn = displayMode !== 'ja';
        const showJa = displayMode !== 'en';

        c.innerHTML = `
          ${item.sec ? `<div class="tag-sec">[${item.sec}]</div>` : ''}
          <div class="card-main">
            <div>
              ${showEn ? `<div class="en-text">${item.en}</div>` : ''}
              ${showJa ? `<div class="ja-text">${item.ja}</div>` : ''}
            </div>
            <span style="font-size:11px; color:${item.status === 'master' ? 'var(--success)' : 'var(--warning)'}; font-weight:700;">
              ${item.status === 'master' ? '定着' : '復習'}
            </span>
          </div>
          ${item.note ? `
            <span class="details-toggle" onclick="event.stopPropagation(); toggleDetail(${i})">▼ 解説・構文ポイント</span>
            <div class="details-box" id="detail-${i}">${item.note}</div>
          ` : ''}
        `;
        c.onclick = () => {
          activeIdx = i;
          audio.currentTime = item.start;
          if (audio.paused) { audio.play(); document.getElementById('playBtn').innerText = "❚❚"; }
          renderCards();
        };
        deck.appendChild(c);
      });
    }

    function toggleDetail(i) {
      document.getElementById(`detail-${i}`).classList.toggle('open');
    }

    function togglePlay() {
      if (!audio.src) return alert("先にMP3音源を選択してください");
      if (audio.paused) { audio.play(); document.getElementById('playBtn').innerText = "❚❚"; }
      else { audio.pause(); document.getElementById('playBtn').innerText = "▶"; }
    }

    function toggleLoopLock() {
      isLoopLocked = !isLoopLocked;
      const b = document.getElementById('loopLockBtn');
      b.innerText = `フレーズ固定: ${isLoopLocked ? 'ON' : 'OFF'}`;
      b.classList.toggle('active', isLoopLocked);
      renderCards();
    }

    function cycleRate() {
      rateIdx = (rateIdx + 1) % rates.length;
      audio.playbackRate = rates[rateIdx];
      document.getElementById('rateBtn').innerText = `${rates[rateIdx]}x`;
    }

    function setDisplayMode(m) {
      displayMode = m;
      document.querySelectorAll('.filter-btn').forEach((b, i) => {
        b.classList.toggle('active', (m === 'all' && i === 0) || (m === 'en' && i === 1) || (m === 'ja' && i === 2));
      });
      renderCards();
    }

    function markCard(s) {
      trackItems[activeIdx].status = s;
      renderCards();
    }

    // Audio time update
    audio.ontimeupdate = () => {
      const cur = audio.currentTime;
      const dur = audio.duration || 0;
      if (dur > 0) {
        document.getElementById('seekBar').style.width = `${(cur / dur) * 100}%`;
        const cm = Math.floor(cur / 60), cs = Math.floor(cur % 60).toString().padStart(2, '0');
        const dm = Math.floor(dur / 60), ds = Math.floor(dur % 60).toString().padStart(2, '0');
        document.getElementById('timeLabel').innerText = `${cm}:${cs} / ${dm}:${ds}`;
      }

      const active = trackItems[activeIdx];
      if (isLoopLocked && active) {
        if (cur >= active.end) {
          audio.currentTime = Math.max(0, active.start - 0.1); // 余白アソビ
        }
      } else {
        const found = trackItems.findIndex(x => cur >= x.start && cur < x.end);
        if (found !== -1 && found !== activeIdx) {
          activeIdx = found;
          renderCards();
        }
      }
    };

    document.getElementById('seekWrap').onclick = (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
    };

    // --- SYNC STUDIO LOGIC ---
    let syncLines = [];
    let syncIdx = 0;
    let isSyncing = false;

    function handleSyncTap() {
      const btn = document.getElementById('syncTapBtn');
      const status = document.getElementById('syncStatus');

      if (!isSyncing) {
        const txt = document.getElementById('studioInput').value.trim();
        if (!txt) return alert("先に歌詞テキストを入力してください");
        if (!audio.src) return alert("MP3音源を先に選択してください");

        // Parse lines
        syncLines = txt.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        syncIdx = 0;
        isSyncing = true;
        btn.innerText = "【次の行をマーク】 (タップ)";
        btn.style.background = "var(--warning)";
        btn.style.color = "#000";
        audio.currentTime = 0;
        audio.play();
        document.getElementById('playBtn').innerText = "❚❚";
        status.innerText = `再生中... 1行目「${syncLines[0]}」の歌い出しでタップ！`;
        return;
      }

      // Mark current
      const t = Math.max(0, audio.currentTime - 0.15); // 自動アソビ補正
      if (syncIdx < syncLines.length) {
        if (syncIdx === 0) {
          trackItems = [];
        } else {
          trackItems[trackIdx(syncIdx - 1)].end = t;
        }

        const line = syncLines[syncIdx];
        const isTag = line.startsWith('[') && line.endsWith(']');
        trackItems.push({
          sec: isTag ? line.replace(/[\[\]]/g, '') : '',
          start: t,
          end: t + 3.0,
          en: line,
          ja: "",
          note: "",
          status: "review"
        });

        syncIdx++;
        if (syncIdx < syncLines.length) {
          status.innerText = `記録済 (${syncIdx}/${syncLines.length}) → 次: 「${syncLines[syncIdx]}」`;
        } else {
          status.innerText = "全行マーク完了！曲の終わりで終了します";
          btn.innerText = "同期を完了してプレイヤーに戻る";
          btn.style.background = "var(--success)";
          btn.onclick = finishSync;
        }
      }
    }

    function trackIdx(idx) { return idx; }

    function finishSync() {
      if (trackItems.length > 0) {
        trackItems[trackItems.length - 1].end = audio.currentTime;
      }
      isSyncing = false;
      const btn = document.getElementById('syncTapBtn');
      btn.innerText = "曲を流してタップ同期を開始";
      btn.style.background = "var(--accent)";
      btn.style.color = "#fff";
      btn.onclick = handleSyncTap;
      switchTab('player');
      renderCards();
      alert("同期データが反映されました！");
    }

    // Init
    restoreAudio();
    renderCards();
  </script>
</body>
</html>
